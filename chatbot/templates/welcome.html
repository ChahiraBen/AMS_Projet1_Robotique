<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bienvenue — Assistant Pepper</title>
  <link rel="stylesheet" href="/static/css/welcome.css"/>
</head>
<body>
  <div class="page">
    <div class="card">

      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
          <circle cx="40" cy="40" r="38" fill="#1a6fc4" opacity=".1"/>
          <circle cx="40" cy="40" r="38" stroke="#1a6fc4" stroke-width="1.5" opacity=".25"/>

        </svg>
      </div>

      <p class="brand">Hôpital Central d'Avignon</p>
      <h1>Bonjour, je suis <em>Pepper</em></h1>
      <p class="desc">
        Votre assistant d'accueil intelligent.<br>
        Je vous aide à trouver un service, consulter les horaires
        ou prendre un rendez-vous.
      </p>

      <a href="/chat" class="btn">

          <path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
        </svg>
        Commencer la conversation
      </a>

      <div class="feats">
        <div class="feat">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="26" height="26">
            <path d="M12 2C8.1 2 5 5.1 5 9c0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7zm0 9.5c-1.4 0-2.5-1.1-2.5-2.5S10.6 6.5 12 6.5s2.5 1.1 2.5 2.5S13.4 11.5 12 11.5z"/>

        </div>
        <div class="feat">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="26" height="26">

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistant Pepper – Accueil Hospitalier</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">

    <!-- ── Colonne gauche : conversations ── -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <span class="sidebar-title">Conversations</span>
        <button id="new-chat-btn" title="Nouvelle conversation">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        </button>
      </div>
      <div id="conv-list"></div>
    </aside>

    <!-- ── Colonne droite : chat ── -->
    <div id="main-panel">
      <header>
        <div class="header-inner">
          <!-- Bouton pour cacher/montrer la sidebar -->
          <button id="sidebar-toggle" title="Afficher / masquer les conversations">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
              <path d="M3 18v-2h18v2H3zm0-5v-2h18v2H3zm0-5V6h18v2H3z"/>
            </svg>
          </button>
          <img src="/static/img/pepper_icon.svg" alt="Pepper" class="pepper-icon" onerror="this.style.display='none'" />
          <div>
            <h1>Assistant d'accueil</h1>
            <p class="subtitle">Hôpital Central d'Avignon</p>
          </div>
        </div>
      </header>

      <main>
        <div id="chat-container">
          <div id="messages"></div>
        </div>
        <div id="info-card" class="hidden">
          <h2 id="card-title"></h2>
          <div id="card-body"></div>
        </div>
      </main>

      <footer>
        <form id="chat-form" autocomplete="off">
          <input id="user-input" type="text" placeholder="Posez votre question…" autofocus maxlength="300" />
          <button type="button" id="mic-btn" title="Parler" aria-label="Activer le micro">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <button type="submit" id="send-btn">Envoyer</button>
        </form>
      </footer>
    </div>
  </div>

  <script src="/static/js/chat.js"></script>
</body>
</html>
